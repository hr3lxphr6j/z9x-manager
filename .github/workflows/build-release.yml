name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name without v prefix (e.g. 1.2.0)'
        required: false
        default: '1.2.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          # Prefer whatever cmdline-tools layout the runner has
          if command -v sdkmanager >/dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          elif [[ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;36.0.0"

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version || '1.2.0' }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          sed -i "s/versionName = \".*\"/versionName = \"$V\"/" app/build.gradle.kts
          CODE=$(echo "$V" | awk -F. '{printf "%d", ($1*100)+($2*10)+$3}')
          sed -i "s/versionCode = .*/versionCode = $CODE/" app/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          if ls app/build/outputs/apk/named/Z9XManager-v*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/named/Z9XManager-v*.apk dist/
          else
            SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
            cp "$SRC" "dist/Z9XManager-v${{ steps.ver.outputs.version }}.apk"
          fi
          APK=$(ls dist/Z9XManager-v*.apk | head -1)
          echo "apk=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z9XManager-v${{ steps.ver.outputs.version }}
          path: dist/Z9XManager-v*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Z9X Manager ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: dist/Z9XManager-v*.apk
          body: |
            极米助手 / Z9X Manager `${{ steps.ver.outputs.tag }}`（Gradle + Kotlin）

            - 包名：`local.z9x.manager`
            - APK：`${{ steps.apk.outputs.apk }}`
            - SHA256：`${{ steps.apk.outputs.sha256 }}`
            - 签名：Android **debug** keystore（CI 默认；见 README 换自有 keystore）

            侧载后可用：网络 ADB、可选预装卸载/恢复、Aerial 下载安装与配置命令导出。
            **不含**售后 SSH / adb_keys / Magisk。

            > 从 1.0.x 升级：签名变更，需先卸载旧包再装。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
